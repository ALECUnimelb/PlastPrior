name: Python compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies (macOS and Linux)
        if: runner.os != 'Windows'
        run: python -m pip install -r requirements.txt
      - name: Install with the Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: call setup_windows.cmd
      - name: Test (macOS and Linux)
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Test on native Windows, including non-UTF-8 defaults
        if: runner.os == 'Windows'
        shell: cmd
        run: .venv\Scripts\python.exe -X utf8=0 -m unittest discover -s tests -v
      - name: Check the Windows entry point
        if: runner.os == 'Windows'
        shell: cmd
        run: call run_windows.cmd --help
